<!DOCTYPE html>
<html>
<head>
  <title>Login | Transport Booking</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; text-align: center; }
    form { background: white; display: inline-block; padding: 20px; margin-top: 80px; border-radius: 8px; }
    input { margin: 8px; padding: 8px; width: 200px; }
    button { padding: 8px 20px; background: teal; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Login to Transport Booking</h2>
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Login</button><br>
    <p>Don't have an account? <a href="/signup">Sign Up</a></p>
  </form>
</body>
</html>
