<!DOCTYPE html>
<html>
<head>
  <title>Book Ticket</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; text-align: center; margin-top: 70px; }
    form { display: inline-block; background: white; padding: 20px; border-radius: 8px; }
    select, input { margin: 10px; padding: 8px; width: 200px; }
    button { background: teal; color: white; padding: 8px 20px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Book Your Ticket</h2>

  <form method="POST" action="/search/flight">
    <h3>Flight</h3>
    <select name="from_city" required>
      <option value="">From</option>
      <option>Delhi</option><option>Mumbai</option><option>Chennai</option>
      <option>Kolkata</option><option>Bengaluru</option><option>Hyderabad</option>
      <option>Pune</option><option>Ahmedabad</option><option>Goa</option><option>Jaipur</option>
    </select>
    <select name="to_city" required>
      <option value="">To</option>
      <option>Delhi</option><option>Mumbai</option><option>Chennai</option>
      <option>Kolkata</option><option>Bengaluru</option><option>Hyderabad</option>
      <option>Pune</option><option>Ahmedabad</option><option>Goa</option><option>Jaipur</option>
    </select>
    <input type="date" name="date" required>
    <button type="submit">Search Flights</button>
  </form>

  <br><br>

  <form method="POST" action="/search/train">
    <h3>Train</h3>
    <select name="from_city" required>
      <option value="">From</option>
      <option>Delhi</option><option>Mumbai</option><option>Chennai</option>
      <option>Kolkata</option><option>Bengaluru</option><option>Hyderabad</option>
      <option>Pune</option><option>Ahmedabad</option><option>Goa</option><option>Jaipur</option>
    </select>
    <select name="to_city" required>
      <option value="">To</option>
      <option>Delhi</option><option>Mumbai</option><option>Chennai</option>
      <option>Kolkata</option><option>Bengaluru</option><option>Hyderabad</option>
      <option>Pune</option><option>Ahmedabad</option><option>Goa</option><option>Jaipur</option>
    </select>
    <input type="date" name="date" required>
    <button type="submit">Search Trains</button>
  </form>

  <br><br>

  <form method="POST" action="/search/bus">
    <h3>Bus</h3>
    <select name="from_city" required>
      <option value="">From</option>
      <option>Delhi</option><option>Mumbai</option><option>Chennai</option>
      <option>Kolkata</option><option>Bengaluru</option><option>Hyderabad</option>
      <option>Pune</option><option>Ahmedabad</option><option>Goa</option><option>Jaipur</option>
    </select>
    <select name="to_city" required>
      <option value="">To</option>
      <option>Delhi</option><option>Mumbai</option><option>Chennai</option>
      <option>Kolkata</option><option>Bengaluru</option><option>Hyderabad</option>
      <option>Pune</option><option>Ahmedabad</option><option>Goa</option><option>Jaipur</option>
    </select>
    <input type="date" name="date" required>
    <button type="submit">Search Buses</button>
  </form>
</body>
</html>
