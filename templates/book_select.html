{% extends "base.html" %}
{% block title %}Book Tickets | Transport Booking{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-10">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-ticket-perforated me-2 text-teal"></i>Book Your Ticket</h2>
    </div>

    <div class="row g-4">
      <!-- Flight Booking -->
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm border-0 transport-card" data-mode="flight">
          <div class="card-header-teal text-white text-center">
            <i class="bi bi-airplane fs-1"></i>
            <h4 class="mt-2 mb-0">Flights</h4>
          </div>
          <div class="card-body">
            <form method="POST" action="{{ url_for('search', mode='flight') }}" data-loading="Searching flights..." class="h-100">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

              <div class="mb-3">
                <label for="flight_from" class="form-label">From</label>
                <select class="form-select" id="flight_from" name="from_city" required>
                  <option value="">Select city</option>
                  {% for city in cities %}
                  <option value="{{ city }}">{{ city }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label for="flight_to" class="form-label">To</label>
                <select class="form-select" id="flight_to" name="to_city" required>
                  <option value="">Select city</option>
                  {% for city in cities %}
                  <option value="{{ city }}">{{ city }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label for="flight_date" class="form-label">Date</label>
                <input type="date" class="form-control" id="flight_date" name="date" required min="{{ today }}">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-teal">
                  <i class="bi bi-search me-1"></i>Search Flights
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Train Booking -->
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm border-0 transport-card" data-mode="train">
          <div class="card-header-teal text-white text-center">
            <i class="bi bi-train-front fs-1"></i>
            <h4 class="mt-2 mb-0">Trains</h4>
          </div>
          <div class="card-body">
            <form method="POST" action="{{ url_for('search', mode='train') }}" data-loading="Searching trains..." class="h-100">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

              <div class="mb-3">
                <label for="train_from" class="form-label">From</label>
                <select class="form-select" id="train_from" name="from_city" required>
                  <option value="">Select city</option>
                  {% for city in cities %}
                  <option value="{{ city }}">{{ city }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label for="train_to" class="form-label">To</label>
                <select class="form-select" id="train_to" name="to_city" required>
                  <option value="">Select city</option>
                  {% for city in cities %}
                  <option value="{{ city }}">{{ city }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label for="train_date" class="form-label">Date</label>
                <input type="date" class="form-control" id="train_date" name="date" required min="{{ today }}">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-teal">
                  <i class="bi bi-search me-1"></i>Search Trains
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Bus Booking -->
      <div class="col-12 col-md-4">
        <div class="card h-100 shadow-sm border-0 transport-card" data-mode="bus">
          <div class="card-header-teal text-white text-center">
            <i class="bi bi-bus-front fs-1"></i>
            <h4 class="mt-2 mb-0">Buses</h4>
          </div>
          <div class="card-body">
            <form method="POST" action="{{ url_for('search', mode='bus') }}" data-loading="Searching buses..." class="h-100">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

              <div class="mb-3">
                <label for="bus_from" class="form-label">From</label>
                <select class="form-select" id="bus_from" name="from_city" required>
                  <option value="">Select city</option>
                  {% for city in cities %}
                  <option value="{{ city }}">{{ city }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label for="bus_to" class="form-label">To</label>
                <select class="form-select" id="bus_to" name="to_city" required>
                  <option value="">Select city</option>
                  {% for city in cities %}
                  <option value="{{ city }}">{{ city }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label for="bus_date" class="form-label">Date</label>
                <input type="date" class="form-control" id="bus_date" name="date" required min="{{ today }}">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-teal">
                  <i class="bi bi-search me-1"></i>Search Buses
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Set min date to today for all date inputs
document.addEventListener('DOMContentLoaded', function() {
  var today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type="date"]').forEach(function(input) {
    input.min = today;
  });

  // Prevent same city selection
  document.querySelectorAll('form').forEach(function(form) {
    var fromSelect = form.querySelector('select[name="from_city"]');
    var toSelect = form.querySelector('select[name="to_city"]');

    function validateCities() {
      if (fromSelect.value && toSelect.value && fromSelect.value === toSelect.value) {
        toSelect.setCustomValidity('Origin and destination cannot be the same');
        toSelect.reportValidity();
      } else {
        toSelect.setCustomValidity('');
      }
    }

    fromSelect.addEventListener('change', validateCities);
    toSelect.addEventListener('change', validateCities);
  });
});
</script>
{% endblock %}
